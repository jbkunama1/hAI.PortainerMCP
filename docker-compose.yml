# hAI.PortainerMCP — stack deploybar per Portainer

services:
  portainer-mcp:
    image: ghcr.io/jbkunama1/hai.portainermcp:latest
    container_name: portainer-mcp
    restart: unless-stopped

    networks:
      - highfishNetwork

    ports:
      - "8025:8025"   # MCP (streamable HTTP)
      - "8026:8026"   # Admin-Webseite (Alias-Verwaltung)

    # Alias-Datei (enthält API-Keys!) — bind-mount, beschreibbar,
    # damit die Admin-Webseite neue Aliase speichern kann.
    volumes:
      - ./data:/usr/src/app/data

    environment:
      PORTAINER_MCP_PORT: "${PORTAINER_MCP_PORT:-8025}"
      PORTAINER_ADMIN_PORT: "${PORTAINER_ADMIN_PORT:-8026}"
      # Leer = Admin-Seite deaktiviert. Bitte einen starken Wert setzen!
      PORTAINER_ADMIN_PASSWORD: "${PORTAINER_ADMIN_PASSWORD:-CHANGE_ME_ADMIN}"
      PORTAINER_ALIASES_FILE: "/usr/src/app/data/portainer_aliases.json"

networks:
  highfishNetwork:
    external: true